# Nginx proxy for Streamlit on Cloud Run
# Optimized configuration to reduce spam and unnecessary logs
worker_processes 1;
events { worker_connections 1024; }

http {
    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Configuración de rate limiting para evitar spam
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    
    server {
        listen 8080;
        server_name _;
        
        # Reduce logs for health checks
        location /healthz {
            access_log off;
            error_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
        
        # Block external emoji CDN requests
        location ~* \.(png|jpg|jpeg|gif|svg)$ {
            if ($http_referer ~* "twemoji\.maxcdn\.com|emoji-cdn|emoji\.aranja\.com") {
                return 404;
            }
        }
        
        # Reduce logs for favicon and static resources
        location ~* \.(ico|css|js|png|jpg|jpeg|gif|svg)$ {
            access_log off;
            error_log off;
            proxy_pass http://localhost:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Main configuration with rate limiting
        location / {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://localhost:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts to avoid hanging connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
} 