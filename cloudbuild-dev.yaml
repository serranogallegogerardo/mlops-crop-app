steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/streamlit-app:dev-$SHORT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/streamlit-app:dev-$SHORT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'streamlit-app-dev',
        '--image', 'gcr.io/$PROJECT_ID/streamlit-app:dev-$SHORT_SHA',
        '--region', 'southamerica-east1',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '8080',
        '--memory', '512Mi',
        '--cpu', '1',
        '--max-instances', '2'
      ]
images:
  - 'gcr.io/$PROJECT_ID/streamlit-app:dev-$SHORT_SHA' 